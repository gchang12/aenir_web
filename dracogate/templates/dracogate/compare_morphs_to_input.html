{% extends "_base.html" %}

{% block title %}
  Compare Morphs to Input
{% endblock %}

{% block main %}
<article id="compare_morphs_to_input">
  <h1>Compare Morphs to Input</h1>
  <ul>
    {% for virtualmorph in virtualmorph_list %}
    <li>
      <a href="{% url 'dracogate:compare_morph_to_input' virtualmorph.id %}">
        FE{{virtualmorph.game_no}} {{virtualmorph.unit}} ({{ virtualmorph.name }})
      </a>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
