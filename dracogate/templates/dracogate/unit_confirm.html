{% extends "_base.html" %}
{% load static %}

{% block title %}
Create Morph: FE{{game_no}} {{unit}}
{% endblock %}

{% block main %}
<article id="unit_confirm">
  <h1>Create Morph</h1>
  <h2>Unit Confirm</h2>
  <div id="init_params" class="grid grid-cols-2 gap-4 items-center">
    <figure>
      <img src="{% get_static_prefix %}dracogate/images/fe{{game_no}}/characters/{{unit}}.{% if game_no == 8 %}gif{% else %}png{% endif %}" />
      <figcaption>
        <h3 title="FE{{game_no}}!{{unit}}">{{ unit }}</h3>
      </figcaption>
    </figure>
    <form
      method="post"
      id="unit_confirm_form">
      {% csrf_token %}
      {{ form }}
      {% if form.declared_fields %}
      <button type="button" class="ConfirmButton"
        hx-target="#unit_confirm_forecast"
        hx-trigger="click"
        hx-get="{% url 'dracogate:unit_confirm_forecast' game_no unit %}"
        hx-include="#unit_confirm_form"
        >Preview</button>
      {% endif %}
      <button class="ConfirmButton">Create</button>
    </form>
  </div>
  <div id="unit_confirm_forecast"
    hx-get="{% url 'dracogate:unit_confirm_forecast' game_no unit %}"
    hx-trigger="load"
    class="m-4">
  </div>
</article>
{% endblock %}
