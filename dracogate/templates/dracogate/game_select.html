{% extends "_base.html" %}
{% load static %}

{% block title %}
Create Morph
{% endblock %}

{% block main %}
<article id="morph_init">
  <h1>Create Morph</h1>
  <h2>Game Select</h2>
  <ol class="grid xl:grid-cols-3 lg:grid-cols-2 gap-9 m-4 grid-cols-1">
    {% for game in games %}
    <li class="border hover:underline hover:border-black p-4">
      <a href="{% url 'dracogate:unit_select' game.game_no %}">
        <figure>
          <img src="{% get_static_prefix %}dracogate/images/fe{{game.game_no}}/cover-art.png" />
          <figcaption>
            <h3 class="text-center">FE{{game.game_no}}</h3>
            <h4 class="text-center">{{ game.title }}</h4>
          </figcaption>
        </figure>
      </a>
    </li>
    {% endfor %}
  </ol>
</article>
{% endblock %}
