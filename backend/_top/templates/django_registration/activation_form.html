{% extends "_base.html" %}

{% block main %}
<div id="activation_form">
  <article>
    <h1>Account Activation Form</h1>
    <p>Paste the code you received via e-mail in the space below.</p>
    <p><a href="{% url 'django_registration_register' %}">Haven't got one?</a></p>
    <form method="post">
      {% csrf_token %}
      {{ form }}
      <button>Submit</button>
      {% if activation_error %}
        {{ activation_error }}
      {% endif %}
    </form>
  </article>
</div>
{% endblock %}
