{% extends "_base.html" %}

{% block title %}
Register
{% endblock %}

{% block main %}
<article id="registration_form">
  <h1>Register</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button>Submit</button>
    {% if activation_errors %}
      {{activation_errors}}
    {% endif %}
  </form>
</article>
{% endblock %}
