{% extends "_base.html" %}

{% block main %}
<div id="registration_form">
  <article>
    <h1>Account Registration Form</h1>
    <form method="post">
      {% csrf_token %}
      {{ form }}
      <button>Submit</button>
      {% if activation_errors %}
        {{activation_errors}}
      {% endif %}
    </form>
  </article>
</div>
{% endblock %}
