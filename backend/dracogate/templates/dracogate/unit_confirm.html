{% extends "_base.html" %}
{% load static %}

{% block main %}
<article id="unit_confirm" class="flex flex-col items-center">
  <h1>Create Morph</h1>
  <h2>Unit Confirm</h2>
  <div id="init_params" class="grid grid-cols-2 gap-4 items-center">
    <figure>
      <img src="{% get_static_prefix %}dracogate/images/fe{{game_no}}/characters/{{unit}}.png" />
      <figcaption>
        <h3 title="FE{{game_no}}!{{unit}}">{{ unit }}</h3>
      </figcaption>
    </figure>
    <form
      method="post"
      hx-target="#unit_confirm_forecast"
      hx-trigger="change"
      hx-get="{% url 'dracogate:unit_confirm_forecast' game_no unit %}">
      {% csrf_token %}
      {{ form }}
      <button class="border font-bold p-2 hover:cursor-pointer hover:bg-yellow-100 hover:underline">Create</button>
    </form>
  </div>
  <div id="unit_confirm_forecast"
    hx-get="{% url 'dracogate:unit_confirm_forecast' game_no unit %}"
    hx-trigger="load"
    class="m-4">
  </div>
</article>
{% endblock %}
