{% extends "dracogate/game_select.html" %}

{% load static %}

{% block title %}
Create Morph – FE{{game_no}}
{% endblock %}

{% block unit_select %}

<section id="unit_select">

  <h2>Unit Select</h2>
  <menu>
    {% for unit in units %}
    <li{% if unit == name %} class="active"{% endif %}>
      <a href="{% url 'dracogate:unit_confirm' game_no unit %}#FE{{game_no}}">
        <figure>
          <img src="{% get_static_prefix %}dracogate/images/{{game_no}}/characters/{{unit}}.png" />
          <figcaption>{{ unit }}</figcaption>
        </figure>
      </a>
    </li>
    {% endfor %}
  </menu>

</section>

{% block unit_confirm %}
{% endblock %}

{% endblock %}
