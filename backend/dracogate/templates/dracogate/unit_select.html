{% extends "_base.html" %}
{% load static %}

{% block main %}
<article id="unit_select">
  <h1>Create Morph</h1>
  <h2>Unit Select</h2>
  <ul class="grid lg:grid-cols-4 md:grid-cols-3 sm:grid-cols-2 grid-cols-1 m-4">
    {% for unit in units %}
    <li class="border p-4">
      <a href="{% url 'dracogate:unit_confirm' game_no unit %}" class="hover:underline">
        <figure class="flex">
          <img width="50" src="{% get_static_prefix %}dracogate/images/fe{{game_no}}/characters/{{unit}}.{% if game_no == 8 %}gif{% else %}png{% endif %}" />
          <figcaption class="flex">
            <h3 class="p-2">{{ unit }}</h3>
          </figcaption>
        </figure>
      </a>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
