{% extends "_base.html" %}

{% block main %}
<article>
  <h1>Compare Morphs</h1>
  <ul>
    {% for virtualmorph in virtualmorph_list %}
    <li>
      <a href="{% url 'dracogate:compare_morph' virtualmorph.id %}">
        FE{{virtualmorph.game_no}} {{virtualmorph.unit}} ({{ virtualmorph.name }})
      </a>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
