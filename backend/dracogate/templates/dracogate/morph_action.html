{% extends "_base.html" %}
{% load static %}

{% block main %}
<article id="morph_action">
  <h1>{{ object.name }}</h1>
  <h2>{{action.title}}</h2>
  <img src="{% get_static_prefix %}dracogate/images/fe{{object.game_no}}/characters/{{object.unit}}.{% if object.game_no == 8 %}gif{% else %}png{% endif %}" />
  <form
    method="post"
    hx-get="{% url 'dracogate:action_forecast' object.id %}?action={{action.name}}&stat_type={{action.stat_type}}"
    hx-target="#action_forecast"
    hx-trigger="change"
    class="MorphActionForm border">
    {% csrf_token %}
    {{ form }}
    <button class="ConfirmButton" {% if not is_success %} disabled{% endif %}>Confirm</button>
  </form>
  <article>
    <h3>{% if action.stat_type == "bases" %}Bases{% else %}Growths{% endif %}</h3>
    <div id="action_forecast"
      hx-get="{% url 'dracogate:action_forecast' object.id %}?stat_type={{action.stat_type}}"
      hx-trigger="load"
      class="grid grid-cols-2 gap-9 m-4"
      >
    </div>
  </article>
</article>
{% endblock %}
