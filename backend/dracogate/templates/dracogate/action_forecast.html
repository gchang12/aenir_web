<figure>
  <figcaption><h4>Before</h4></figcaption>
  <table class="m-4">
    <thead>
      <tr>
        <th>Class</th>
        <td>{{before.unit_class}}</td>
      </tr>
      <tr>
        <th>Level</th>
        <td>{{before.unit_lv}}</td>
      </tr>
    </thead>
    <tbody>
      {% for stat in before.numeric_stats %}
      <tr>
        <th class="StatName">{{ stat.name }}</th>
        <td>
          <meter min="0" high="{{ stat.max }}" optimum="{{ stat.max }}" max="{{ stat.absmax }}" value="{{ stat.value }}"></meter>
          {{ stat.value }}{% if stat_type == "growths" %}%{% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
<figure>
  <figcaption><h4>After</h4></figcaption>
  <table class="m-4">
    <thead>
      <tr>
        <th>Class</th>
        <td>{{after.unit_class}}</td>
      </tr>
      <tr>
        <th>Level</th>
        <td>{{after.unit_lv}}</td>
      </tr>
    </thead>
    <tbody>
      {% for stat in after.numeric_stats %}
      <tr class="stat{% if stat.delta > 0 %} increased{% elif stat.delta < 0 %} decreased{% endif %}">
        <th class="StatName">{{ stat.name }}</th>
        <td>
          <meter min="0" high="{{ stat.max }}" optimum="{{ stat.max }}" max="{{ stat.absmax }}" value="{{ stat.value }}"></meter>
          {{ stat.value }}{% if stat_type == "growths" %}%{% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
