{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block main %}
<h1>Create Account</h1>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <button>Submit</button>
</form>
<a href="{% url 'accounts:create_account' %}">Don't have an account yet?</a>
<a href="{% url 'accounts:password_reset' %}">Forget your password?</a>
{% endblock %}
